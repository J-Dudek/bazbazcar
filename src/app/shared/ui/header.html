<header class="j6n-header">
  <a class="j6n-brand" routerLink="/">
    <img class="brand-logo" src="/logo.svg" alt="" width="43" height="48" />
    bazbazcar
  </a>
  <button
    class="j6n-nav__toggle j6n-btn j6n-btn--ghost j6n-btn--icon"
    type="button"
    data-j6n-js="menu-toggle"
    aria-expanded="false"
    aria-label="Ouvrir le menu"
  >
    ☰
  </button>
  <nav class="j6n-nav">
    @if (ready()) {
      @if (auth.session()) {
        @if (auth.profile()?.statut === 'valide') {
          <a class="j6n-nav__link" routerLink="/evenements">Événements</a>
          @if (auth.profile()?.role === 'admin') {
            <a class="j6n-nav__link" routerLink="/admin/evenements/nouveau">Créer un événement</a>
            <a class="j6n-nav__link" routerLink="/admin/inviter">Inviter des membres</a>
            <a class="j6n-nav__link" routerLink="/admin/membres">Gérer les membres</a>
            <a class="j6n-nav__link" routerLink="/admin/statistiques">Statistiques</a>
          }
        }
        <a class="j6n-nav__link" routerLink="/mon-compte">Gérer mon compte</a>
        <button class="j6n-btn j6n-btn--ghost" type="button" (click)="seDeconnecter()">
          Se déconnecter
        </button>
      } @else {
        <a
          class="j6n-nav__link"
          routerLink="/connexion"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          Connexion
        </a>
        <a
          class="j6n-nav__link"
          routerLink="/inscription"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          Inscription
        </a>
      }
    }
  </nav>
</header>
